# YOLOv8 Hyperparameters

# Optimizer & Learning Rate
optimizer: AdamW
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss & Regularization
box: 7.5
cls: 0.5
dfl: 1.5
pose: 12.0
kobj: 2.0
label_smoothing: 0.0
nbs: 64
dropout: 0.0   #0.0 earlier its zero now mankign 0.2

# Augmentation
auto_augment: False
augment : False
hsv_h: 0.0     #0.015
hsv_s: 0.0  #0.7
hsv_v: 0.0 #0.4
degrees: 0.0
translate: 0.0 #0.1
scale: 0.2   #0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
erasing: 0.0
crop_fraction: 1.0

# Mask & Segmentation
overlap_mask: true
mask_ratio: 4

# Detection
conf: 0.5
iou: 0.5
max_det: 300
single_cls: false

# Training Control
amp: true
fraction: 1.0
multi_scale: false
resume: false
profile: false
freeze: null

# Advanced
rect: false
cos_lr: false
close_mosaic: 10

# Additional (if needed)
half: false
dnn: false

# Add any other custom hyperparameters below as needed
